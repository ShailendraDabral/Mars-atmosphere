# Smoke test: whole workflow on synthetic data in a few minutes on a laptop CPU.
DATA_SOURCE: synthetic
SYNTH_PROFILES_PER_YEAR: [30, 22, 34]
OUTPUT_DIR: results/quick
GAP_SIZES_KM: [5, 10]
GAP_LOCATIONS: [middle, upper]
MAX_TEST_PROFILES: 6
SEEDS: [0, 1]
PRETRAIN_EPOCHS: 300
COLLOC_POOL_PER_PROFILE: 60
FINETUNE_STEPS: 80
TUNE_CONFIGS: [[10, middle], [10, upper]]
TUNE_ALPHAS: [0.0, 1.0]
TUNE_LAMBDAS: [1.0]
TUNE_ES: [false]
CAL_GAP_SIZES_KM: [5, 10]
NOISE_SEEDS: 2
LAMBDAS: [0.0, 1.0, 10.0]
HOLDOUT_SEEDS: 1
HOLDOUT_MAX_TEST: 4
N_BOOT: 500
